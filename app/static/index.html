<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f6">
  <meta name="description" content="Opis — API Health Monitor & Incident Reporter">
  <title>Opis — API Health Monitor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2313261e'/%3E%3Cpath d='M13 34h9l5-11 8 20 6-12h10' fill='none' stroke='%23b9efc8' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
<svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="6.5" rx="2"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="2"/><path d="M7 7.25h.01M7 16.75h.01M15.5 7.25h2M15.5 16.75h2"/></symbol>
  <symbol id="i-incident" viewBox="0 0 24 24"><path d="M10.2 4.4 3 17.1a2 2 0 0 0 1.8 3h14.4a2 2 0 0 0 1.8-3L13.8 4.4a2.1 2.1 0 0 0-3.6 0Z"/><path d="M12 9v4.3M12 16.7h.01"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="m7 15 4-4 3 2 5-6"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8.5a6 6 0 0 0-12 0c0 7-2.3 7-2.3 8.5h16.6c0-1.5-2.3-1.5-2.3-8.5ZM10 20h4"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6.5h10M18 6.5h2M4 17.5h2M10 17.5h10"/><circle cx="16" cy="6.5" r="2"/><circle cx="8" cy="17.5" r="2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M4.5 12h15M14 6.5l5.5 5.5L14 17.5"/></symbol>
  <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.5-2L20 12M4 12l2.9 5a7 7 0 0 0 11.5-2"/></symbol>
  <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12 2.3 2.3 4.8-5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.4 4.3L19 7"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="19" cy="12" r=".9"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4 4"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M8 3.5v4M16 3.5v4M4 10h16"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 12h9l1-12M10 11v5M14 11v5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4-.8L19 8.2 15.8 5 4.8 16 4 20ZM14.5 6.3l3.2 3.2"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 10.5v5M12 7.5h.01"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 19 6v5.2c0 4.4-3 7.4-7 9.3-4-1.9-7-4.9-7-9.3V6l7-2.5Z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="m3.5 4 17 8-17 8 2.7-8L3.5 4ZM6.2 12H20"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M5 17v3h14v-3"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13.8 14 10M8.2 15.7l-1.1 1.1a3.5 3.5 0 0 1-4.9-4.9l3.6-3.6a3.5 3.5 0 0 1 4.9 0M15.8 8.3l1.1-1.1a3.5 3.5 0 1 1 4.9 4.9l-3.6 3.6a3.5 3.5 0 0 1-4.9 0"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20H6V3.5ZM14 3.5v4h4M9 12h6M9 15.5h6"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m8.5 7-5 5 5 5M15.5 7l5 5-5 5M13.5 4l-3 16"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.8 12h16.4M12 3.5a13 13 0 0 1 0 17M12 3.5a13 13 0 0 0 0 17"/></symbol>
</svg>
<div id="app" class="app-shell">
  <div id="sidebarScrim" class="sidebar-scrim"></div>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#overview" aria-label="Opis beranda">
      <span class="brand-mark"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M6.5 19h5l3-7 4.4 12 3.4-8 2 3h5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="27.5" cy="9" r="2" fill="#bdf3ca"/></svg></span>
      <span class="brand-word">opis<span>.</span><small>API MONITOR</small></span>
    </a>
    <div class="workspace-label"><div class="workspace-icon">O</div><div><span>WORKSPACE</span><strong>Personal workspace</strong></div><svg class="icon"><use href="#i-down"/></svg></div>
    <div class="side-section-label">MENU UTAMA</div>
    <nav class="side-nav" aria-label="Navigasi utama">
      <button class="nav-item active" data-page="overview"><svg class="icon"><use href="#i-grid"/></svg><span>Overview</span><i></i></button>
      <button class="nav-item" data-page="endpoints"><svg class="icon"><use href="#i-server"/></svg><span>Endpoint</span><em id="endpointCount">0</em></button>
      <button class="nav-item" data-page="incidents"><svg class="icon"><use href="#i-incident"/></svg><span>Insiden</span><em id="incidentCount" class="nav-alert-count" hidden>0</em></button>
      <button class="nav-item" data-page="sla"><svg class="icon"><use href="#i-chart"/></svg><span>Laporan SLA</span></button>
    </nav>
    <div class="side-section-label second">PREFERENSI</div>
    <nav class="side-nav" aria-label="Preferensi">
      <button class="nav-item" data-page="alerts"><svg class="icon"><use href="#i-bell"/></svg><span>Notifikasi</span></button>
      <button class="nav-item" data-page="settings"><svg class="icon"><use href="#i-settings"/></svg><span>Pengaturan</span></button>
    </nav>
    <div class="sidebar-bottom">
      <div class="side-sla">
        <div class="side-sla-head"><span class="small-icon"><svg class="icon"><use href="#i-shield"/></svg></span><span>Target layanan</span></div>
        <div class="side-sla-row"><strong id="sideTarget">99,9%</strong><span>SLA target</span></div>
        <div class="side-progress"><span></span></div>
        <p>Jaga layanan tetap andal.</p>
      </div>
      <div class="workspace-profile"><div class="profile-avatar">O</div><div><strong>Workspace lokal</strong><span>Ruang kerja Anda</span></div><svg class="icon"><use href="#i-more"/></svg></div>
    </div>
  </aside>
  <div class="main-shell">
    <header class="topbar">
      <button id="mobileMenu" class="icon-button mobile-menu" aria-label="Buka menu"><svg class="icon"><use href="#i-menu"/></svg></button>
      <div class="breadcrumb"><span>Workspace</span><span class="breadcrumb-slash">/</span><strong id="breadcrumbPage">Overview</strong></div>
      <div class="topbar-actions">
        <div class="top-system" id="topSystem"><span class="live-dot"></span> <span>Monitoring aktif</span></div>
        <a class="top-docs" href="/docs" target="_blank" rel="noreferrer">API docs <svg class="icon"><use href="#i-arrow-up-right"/></svg></a>
        <button id="notificationButton" class="icon-button notification-button" aria-label="Lihat insiden aktif"><svg class="icon"><use href="#i-bell"/></svg><span id="notificationDot" class="notification-dot" hidden></span></button>
        <button class="button button-primary top-add" data-action="add-endpoint"><svg class="icon"><use href="#i-plus"/></svg><span>Tambah endpoint</span></button>
      </div>
    </header>
    <main class="content" id="view" tabindex="-1"><div class="loading-state"><span class="spinner"></span> Menyiapkan workspace...</div></main>
    <footer class="app-footer"><span>© Opis <span class="footer-dot">·</span> API Health Monitor</span><span>Dibuat untuk layanan yang lebih andal <span class="footer-leaf">✳</span></span></footer>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>
</body>
</html>
